<h2 mat-dialog-title>Restaurar "{{ data.nome }}"</h2>

<mat-dialog-content>
  <p>Edite o nome para renomear ao restaurar (opcional).</p>
  <form [formGroup]="formulario">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" />
      @if (formulario.controls.nome.hasError('maxlength')) {
        <mat-error>Máximo de 100 caracteres</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="restaurar()">Restaurar</button>
</mat-dialog-actions>
