name: CI

on:
  push:
    branches: [main, desenvolvimento, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Lint · Build · Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familyfinance-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: familyfinance-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build:prod

      - name: Testes com cobertura
        run: npm run test:cobertura
